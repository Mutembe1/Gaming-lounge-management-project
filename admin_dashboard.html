<!DOCTYPE html>
<html>
<head>
    <title>Manager | Elite Gaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="brand">ELITE GAMING</div>
            <nav>
                <a class="nav-link active" href="/admin/dashboard">🏠 Dashboard</a>
                <a class="nav-link" href="/admin/analytics">📈 Analytics</a>
                <a class="nav-link" href="/logout">🚪 Logout</a>
            </nav>
        </div>
        <div class="main-content">
            <div class="row g-4">
                <!-- SALES STAT -->
                <div class="col-md-4">
                    <div class="glass-card">
                        <small class="text-muted">TODAY'S REVENUE</small>
                        <h2 class="text-info mt-2">KSH {{ total_sales }}</h2>
                    </div>
                </div>

                <!-- ADD STAFF ACCOUNT (RE-ADDED) -->
                <div class="col-md-8">
                    <div class="glass-card">
                        <h5>Create Staff Account</h5>
                        <form action="/add_user" method="POST" class="row g-2 mt-2">
                            <div class="col-md-5">
                                <input type="text" name="username" placeholder="Username" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-md-5">
                                <input type="password" name="password" placeholder="Password" class="form-control bg-dark text-white border-secondary" required>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-outline-info w-100">Add</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- STATION MONITOR -->
                <div class="col-md-12">
                    <div class="glass-card">
                        <h5>Station Maintenance (Toggle Service)</h5>
                        <div class="st-grid mt-3">
                            {% for s in stations %}
                            <div class="st-item {{ s.status }}">
                                {{ s.name }}<br>
                                <a href="/toggle_service/{{ s.id }}" class="btn btn-dark btn-xs mt-1" style="font-size: 0.5rem;">TOGGLE</a>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <!-- GAME MANAGEMENT -->
                <div class="col-md-6">
                    <div class="glass-card">
                        <h5>Register New Game</h5>
                        <form action="/add_game" method="POST" class="mt-2">
                            <input type="text" name="name" placeholder="Game Name" class="form-control bg-dark text-white mb-2" required>
                            <input type="number" name="rate" placeholder="KSH Rate/Hr" class="form-control bg-dark text-white mb-3" required>
                            <button class="btn btn-elite w-100">Add Game</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="glass-card">
                        <h5>Update Game Rates</h5>
                        {% for g in games %}
                        <form action="/update_game" method="POST" class="d-flex mb-2">
                            <input type="hidden" name="game_id" value="{{ g.id }}">
                            <span class="me-auto">{{ g.name }}</span>
                            <input type="number" name="rate" value="{{ g.rate_per_hour }}" class="form-control form-control-sm w-25 bg-dark text-white border-info me-2">
                            <button class="btn btn-sm btn-outline-info">Save</button>
                        </form>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
